# pnpm blocks dependency build scripts unless they are allowed here. A new
# native dependency needs an entry, or its build step is silently skipped —
# `pnpm approve-builds` writes this file for you. node-pty's entry is what
# puts its prebuilt binary in place; see scripts/fix-spawn-helper.mjs for the
# second half of that story.
allowBuilds:
  esbuild: true
  node-pty: true
  # Pulled in by electron-builder for Squirrel.Windows, which this app does not
  # build. Denied rather than left unlisted so install stops asking.
  electron-winstaller: false
