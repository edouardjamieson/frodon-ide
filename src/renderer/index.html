<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frodon</title>
    <!--
      The renderer loads nothing from the network and executes no inline
      script. Locking that down in a meta CSP means a malicious string that
      reaches the DOM — a filename, a git branch, a language-server message —
      has nowhere to send anything even if it does manage to execute.
      `style-src` allows inline styles because CodeMirror generates them.
      `img-src` allows `blob:` for an image tab, whose bytes arrive from main
      and are drawn from an object URL — one only this page's own script can
      mint, so it opens no route in from anywhere else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
